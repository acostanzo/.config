onboarding = false
[keys]
prefix = "ctrl+a"

# Agent navigation; add Shift for workspace navigation.
focus_agent = "ctrl+alt+1..9"
next_agent = "ctrl+alt+j"
previous_agent = "ctrl+alt+k"
switch_workspace = "ctrl+alt+shift+1..9"
next_workspace = "ctrl+alt+shift+j"
previous_workspace = "ctrl+alt+shift+k"

# Let the Vim-aware plugin handle these keys before Herdr changes panes.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"

[ui]
agent_panel_sort = "spaces"
